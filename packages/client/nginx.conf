server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: любой неизвестный путь отдаёт index.html,
    # чтобы React Router обработал маршрут на клиенте
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статики (Vite добавляет хеши к именам файлов)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Не кэшировать index.html — иначе после деплоя браузер
    # отдаст старую версию и не подтянет новые JS-бандлы
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}